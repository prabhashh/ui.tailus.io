# Local development / single-VPS staging stack. For a production VPS
# deployment, prefer the systemd units in deploy/systemd/ against
# separately-managed Postgres/Redis/NATS (see docs/OPERATIONS.md) — running
# everything via Compose on one box is fine for staging/small deployments,
# not for the 50k-monitor target topology.
version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: uptime
      POSTGRES_PASSWORD: uptime
      POSTGRES_DB: uptime
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ../migrations:/docker-entrypoint-initdb.d
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U uptime"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "6379:6379"

  nats:
    image: nats:2-alpine
    command: ["-js", "-sd", "/data"]
    volumes:
      - natsdata:/data
    ports:
      - "4222:4222"
      - "8222:8222" # monitoring

  prometheus:
    image: prom/prometheus:latest
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9091:9090"

  scheduler:
    build: { context: .., args: { SERVICE: scheduler } }
    depends_on:
      postgres: { condition: service_healthy }
    environment: &common-env
      UPTIME_POSTGRES_DSN: postgres://uptime:uptime@postgres:5432/uptime?sslmode=disable
      UPTIME_REDIS_ADDR: redis:6379
      UPTIME_NATS_URL: nats://nats:4222
      UPTIME_METRICS_ADDR: ":9090"
    ports:
      - "9101:9090"

  prober-default:
    build: { context: .., args: { SERVICE: prober } }
    depends_on:
      postgres: { condition: service_healthy }
    environment:
      <<: *common-env
      UPTIME_REGION: default
    ports:
      - "9102:9090"

  resultprocessor:
    build: { context: .., args: { SERVICE: resultprocessor } }
    depends_on:
      postgres: { condition: service_healthy }
    environment: *common-env
    ports:
      - "9103:9090"

  api:
    build: { context: .., args: { SERVICE: api } }
    depends_on:
      postgres: { condition: service_healthy }
    environment: *common-env
    ports:
      - "8080:8080"

volumes:
  pgdata:
  natsdata:
